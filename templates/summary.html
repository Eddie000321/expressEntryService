<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Express Entry Summary</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <ul>
            <li><a href="{{ url_for('home') }}">Home</a></li>
            <li><a href="{{ url_for('summary') }}">Summary</a></li>
            <li><a href="{{ url_for('score_changes') }}">Score Changes</a></li>
            <li><a href="{{ url_for('news') }}">News</a></li>
        </ul>
    </nav>
    
    <main>
        <div class="card fade-in">
            <h1>Express Entry Summary</h1>
            <h2>Yearly Draw Statistics</h2>
            <div class="chart-container">
                <canvas id="yearlyDrawsChart"></canvas>
            </div>

            <h2>Monthly Draw Distribution</h2>
            <div class="chart-container">
                <canvas id="monthlyDrawsChart"></canvas>
            </div>

            <h2>Program Type Distribution</h2>
            <div class="chart-container">
                <canvas id="programDistributionChart"></canvas>
            </div>

            <h2>Program Mix Share by Year</h2>
            <div class="chart-container">
                <canvas id="programMixChart"></canvas>
            </div>

            <h2>CRS Cut-off & Invitation Trends</h2>
            <div class="chart-controls">
                <div id="cutoffYearFilters" class="year-filter-group"></div>
            </div>
            <div class="chart-container">
                <canvas id="cutoffTrendChart"></canvas>
            </div>

            <h2>Cumulative Draw Momentum</h2>
            <div class="chart-controls">
                <div id="cumulativeYearFilters" class="year-filter-group"></div>
            </div>
            <div class="chart-container">
                <canvas id="cumulativeDrawsChart"></canvas>
            </div>
            
            
        </div>
    </main>

    <script src="{{ url_for('static', filename='charts.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const yearlyCtx = document.getElementById('yearlyDrawsChart').getContext('2d');
            createYearlyDrawsChart(yearlyCtx, {{ years|tojson }}, {{ yearly_draws|map(attribute='count')|list|tojson }});

            const monthlyCtx = document.getElementById('monthlyDrawsChart').getContext('2d');
            createMonthlyDrawsChart(monthlyCtx, {{ years|tojson }}, {{ monthly_data|tojson }});

            const programDistCtx = document.getElementById('programDistributionChart').getContext('2d');
            createProgramDistributionChart(programDistCtx, {{ years|tojson }}, {{ program_data|tojson }});

            const programMixCtx = document.getElementById('programMixChart').getContext('2d');
            createProgramMixChart(programMixCtx, {{ years|tojson }}, {{ program_invite_data|tojson }});

            const cutoffTrendCtx = document.getElementById('cutoffTrendChart').getContext('2d');
            const cutoffSeries = {{ cutoff_series|tojson }};
            const timelineYears = {{ timeline_years|tojson }};
            if (cutoffSeries.length) {
                const cutoffChart = createCutoffTrendChart(cutoffTrendCtx, cutoffSeries);
                setupYearFilter('cutoffYearFilters', timelineYears, function(selectedYear) {
                    const filtered = filterSeriesByYear(cutoffSeries, selectedYear);
                    updateCutoffChart(cutoffChart, filtered);
                });
            }

            const cumulativeCtx = document.getElementById('cumulativeDrawsChart').getContext('2d');
            const cumulativeSeries = {{ cumulative_series|tojson }};
            if (cumulativeSeries.length) {
                const cumulativeChart = createCumulativeDrawsChart(cumulativeCtx, cumulativeSeries);
                setupYearFilter('cumulativeYearFilters', timelineYears, function(selectedYear) {
                    const filtered = filterSeriesByYear(cumulativeSeries, selectedYear);
                    updateCumulativeDrawsChart(cumulativeChart, filtered);
                });
            }

        });
    </script>
</body>
</html>
