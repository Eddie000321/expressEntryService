<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <ul>
            <li><a href="{{ url_for('home') }}">Home</a></li>
            <li><a href="{{ url_for('summary') }}">Summary</a></li>
            <li><a href="{{ url_for('score_changes') }}">Score Changes</a></li>
            <li><a href="{{ url_for('my_score') }}">My Score</a></li>
            <li><a href="{{ url_for('news') }}">News</a></li>
        </ul>
    </nav>
    
    <main>
        {% include '_advisory_boundary.html' %}
        <div class="card fade-in">
            <h1>Immigration News</h1>
            <div class="news-container">
                {% for item in news_items %}
                <div class="news-item">
                    <span class="news-date">{{ item.date }}</span>
                    <h3>{{ item.title }}</h3>
                </div>
                {% endfor %}
            </div>
        </div>
        
    </main>
</body>
</html>
