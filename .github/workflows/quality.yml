name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt pip-audit

      - name: Run tests
        run: python -m pytest -q

      - name: Run static checks
        run: |
          ruff check .
          python -m compileall -q app.py scraper.py data_quality.py tests
          gunicorn --check-config app:app

      - name: Audit dependencies
        run: pip-audit -r requirements-dev.txt
